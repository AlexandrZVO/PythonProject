[tool.poetry]
name = "pythonproject1"
version = "0.1.0"
description = ""
authors = ["Александр <ваш@email.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.14"

[tool.poetry.dev-dependencies]
pytest = "^8.2"
pytest-cov = "^7.1"
flake8 = "^7.0"

[tool.pytest.ini_options]
testpaths = "test"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest-cov (>=7.1.0,<8.0.0)",
    "flake8 (>=7.5.0,<8.0.0)"
]
lint = [
    "black (>=26.10.1,<27.0.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "isort (>=9.0.2,<10.0.0)"
]
